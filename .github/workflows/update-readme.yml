name: Update README Feeds

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        run: |
          python3 <<'PY'
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import re
          import html

          README = "README.md"

          YOUTUBE_FEED = "https://www.youtube.com/feeds/videos.xml?channel_id=UC1eVpwYmIxLqi84OroyZo6w"
          DEV_FEED = "https://dev.to/feed/brdnwd"

          YOUTUBE_START = "<!-- YOUTUBE:START -->"
          YOUTUBE_END = "<!-- YOUTUBE:END -->"

          BLOG_START = "<!-- BLOG:START -->"
          BLOG_END = "<!-- BLOG:END -->"


          # ---------------------------------------------------------
          # Fetch RSS/Atom feed
          # ---------------------------------------------------------

          def fetch_feed(url, retries=5):
              for attempt in range(retries):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": "Mozilla/5.0"
                          }
                      )

                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read()

                  except Exception as e:
                      print(f"Feed attempt {attempt + 1} failed: {e}")

              return None


          # ---------------------------------------------------------
          # Clean text
          # ---------------------------------------------------------

          def clean_text(text):
              if not text:
                  return ""

              text = html.unescape(text)

              # Remove HTML
              text = re.sub(r"<[^>]+>", " ", text)

              # Remove URLs
              text = re.sub(r"https?://\S+", "", text)

              # Remove excessive whitespace
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          # ---------------------------------------------------------
          # Shorten descriptions
          # ---------------------------------------------------------

          def shorten_description(text, max_words=20):
              text = clean_text(text)

              if not text:
                  return ""

              words = text.split()

              if len(words) <= max_words:
                  return text

              return " ".join(words[:max_words]) + "..."


          # ---------------------------------------------------------
          # Escape text for HTML
          # ---------------------------------------------------------

          def escape(text):
              return html.escape(text, quote=True)


          # ---------------------------------------------------------
          # YouTube feed
          # ---------------------------------------------------------

          def get_youtube_videos():
              data = fetch_feed(YOUTUBE_FEED)

              if not data:
                  print("Could not retrieve YouTube feed.")
                  return []

              try:
                  root = ET.fromstring(data)
              except Exception as e:
                  print(f"Could not parse YouTube feed: {e}")
                  return []

              ns = {
                  "atom": "http://www.w3.org/2005/Atom",
                  "yt": "http://www.youtube.com/xml/schemas/2015",
                  "media": "http://search.yahoo.com/mrss/"
              }

              videos = []

              for entry in root.findall("atom:entry", ns)[:4]:

                  video_id = entry.findtext("yt:videoId", default="", namespaces=ns)
                  title = entry.findtext("atom:title", default="", namespaces=ns)

                  link_element = entry.find("atom:link", ns)

                  if link_element is not None:
                      url = link_element.attrib.get("href", "")
                  else:
                      url = f"https://www.youtube.com/watch?v={video_id}"

                  description = ""

                  media_group = entry.find("media:group", ns)

                  if media_group is not None:
                      description_element = media_group.find(
                          "media:description",
                          ns
                      )

                      if description_element is not None:
                          description = description_element.text or ""

                  if not description:
                      summary = entry.find("atom:summary", ns)

                      if summary is not None:
                          description = summary.text or ""

                  thumbnail = ""

                  if video_id:
                      thumbnail = (
                          f"https://img.youtube.com/vi/"
                          f"{video_id}/mqdefault.jpg"
                      )

                  videos.append({
                      "url": url,
                      "thumbnail": thumbnail,
                      "title": title,
                      "description": shorten_description(description, 20)
                  })

              return videos


          # ---------------------------------------------------------
          # DEV.to feed
          # ---------------------------------------------------------

          def get_dev_posts():
              data = fetch_feed(DEV_FEED)

              if not data:
                  print("Could not retrieve DEV.to feed.")
                  return []

              try:
                  root = ET.fromstring(data)
              except Exception as e:
                  print(f"Could not parse DEV.to feed: {e}")
                  return []

              posts = []

              for item in root.findall(".//item")[:8]:

                  title_element = item.find("title")
                  link_element = item.find("link")
                  description_element = item.find("description")

                  title = (
                      title_element.text
                      if title_element is not None
                      else ""
                  )

                  url = (
                      link_element.text
                      if link_element is not None
                      else ""
                  )

                  description = (
                      description_element.text
                      if description_element is not None
                      else ""
                  )

                  # Try to find an image from the RSS enclosure
                  thumbnail = ""

                  enclosure = item.find("enclosure")

                  if enclosure is not None:
                      thumbnail = enclosure.attrib.get("url", "")

                  # Try Media RSS if no enclosure exists
                  if not thumbnail:
                      media_content = item.find(
                          "{http://search.yahoo.com/mrss/}content"
                      )

                      if media_content is not None:
                          thumbnail = media_content.attrib.get("url", "")

                  # Fallback image
                  if not thumbnail:
                      thumbnail = (
                          "https://placehold.co/"
                          "120x68/0a0a0a/ffffff"
                          "?text=DEV.to"
                      )

                  posts.append({
                      "url": url,
                      "thumbnail": thumbnail,
                      "title": title,
                      "description": shorten_description(description, 20)
                  })

              return posts


          # ---------------------------------------------------------
          # Create a single card
          #
          # Each card uses TWO cells:
          #   1. Thumbnail
          #   2. Text
          #
          # Two cards therefore use FOUR cells per row.
          # ---------------------------------------------------------

          def create_card(item):
              url = escape(item["url"])
              thumbnail = escape(item["thumbnail"])
              title = escape(item["title"])
              description = escape(item["description"])

              return f"""
          <td width="120" valign="top" style="padding: 4px 0 4px 4px;">
            <a href="{url}">
              <img src="{thumbnail}" width="120" height="68" alt="">
            </a>
          </td>
          <td valign="top" style="padding: 8px 12px 8px 8px;">
            <a href="{url}">
              <strong>{title}</strong>
            </a>
            <br>
            <small>{description}</small>
          </td>
          """


          # ---------------------------------------------------------
          # Create 2-column card grid
          # ---------------------------------------------------------

          def create_grid(items):
              rows = []

              for i in range(0, len(items), 2):

                  left = create_card(items[i])

                  if i + 1 < len(items):
                      right = create_card(items[i + 1])
                  else:
                      right = """
          <td colspan="2"></td>
          """

                  rows.append(f"""
          <tr>
          {left}
          {right}
          </tr>
          """)

              return f"""
          <table width="100%">
          {''.join(rows)}
          </table>
          """


          # ---------------------------------------------------------
          # Read README
          # ---------------------------------------------------------

          with open(README, "r", encoding="utf-8") as file:
              readme = file.read()


          # ---------------------------------------------------------
          # YouTube
          # ---------------------------------------------------------

          youtube_videos = get_youtube_videos()

          if youtube_videos:
              youtube_content = create_grid(youtube_videos)
          else:
              youtube_content = "_No videos found._"


          # ---------------------------------------------------------
          # DEV.to
          # ---------------------------------------------------------

          dev_posts = get_dev_posts()

          if dev_posts:
              blog_content = create_grid(dev_posts)
          else:
              blog_content = "_No posts found._"


          # ---------------------------------------------------------
          # Replace YouTube section
          # ---------------------------------------------------------

          youtube_pattern = (
              re.escape(YOUTUBE_START)
              + r".*?"
              + re.escape(YOUTUBE_END)
          )

          readme = re.sub(
              youtube_pattern,
              YOUTUBE_START
              + "\n"
              + youtube_content
              + "\n"
              + YOUTUBE_END,
              readme,
              flags=re.DOTALL
          )


          # ---------------------------------------------------------
          # Replace blog section
          # ---------------------------------------------------------

          blog_pattern = (
              re.escape(BLOG_START)
              + r".*?"
              + re.escape(BLOG_END)
          )

          readme = re.sub(
              blog_pattern,
              BLOG_START
              + "\n"
              + blog_content
              + "\n"
              + BLOG_END,
              readme,
              flags=re.DOTALL
          )


          # ---------------------------------------------------------
          # Write README
          # ---------------------------------------------------------

          with open(README, "w", encoding="utf-8") as file:
              file.write(readme)

          print("README updated successfully.")
          print(f"YouTube videos: {len(youtube_videos)}")
          print(f"DEV.to posts: {len(dev_posts)}")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "Update YouTube and DEV.to feeds"
            git push
          fi