name: Update README

on:
  schedule:
    # Run every 6 hours
    - cron: "17 */6 * * *"

  # Allows you to run it manually from Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update YouTube and DEV.to
        run: |
          python <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import html
          import re

          README = "README.md"

          YOUTUBE_FEED = (
              "https://www.youtube.com/feeds/videos.xml?"
              "channel_id=UC1eVpwYmIxLqi84OroyZo6w"
          )

          DEV_FEED = "https://dev.to/feed/brdnwd"

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "brdnwd-readme-updater/1.0"
                  }
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def escape_html(text):
              return html.escape(text, quote=True)

          def update_section(readme, start_marker, end_marker, content):
              pattern = (
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker)
              )

              replacement = (
                  start_marker
                  + "\n"
                  + content
                  + "\n"
                  + end_marker
              )

              return re.sub(
                  pattern,
                  replacement,
                  readme,
                  count=1,
                  flags=re.DOTALL
              )

          # ---------------------------------------------------------
          # YouTube
          # ---------------------------------------------------------

          youtube_root = ET.fromstring(fetch(YOUTUBE_FEED))

          ATOM = "{http://www.w3.org/2005/Atom}"
          YOUTUBE = "{http://www.youtube.com/xml/schemas/2015}"

          youtube_cards = []

          for entry in youtube_root.findall(f"{ATOM}entry")[:5]:

              title = entry.findtext(
                  f"{ATOM}title",
                  default="Untitled Video"
              )

              video_id = entry.findtext(
                  f"{YOUTUBE}videoId",
                  default=""
              )

              link_element = entry.find(f"{ATOM}link")

              if link_element is not None:
                  video_url = link_element.attrib.get("href", "")
              else:
                  video_url = ""

              if not video_url and video_id:
                  video_url = (
                      f"https://www.youtube.com/watch?v={video_id}"
                  )

              if not video_id or not video_url:
                  continue

              thumbnail = (
                  f"https://img.youtube.com/vi/"
                  f"{video_id}/mqdefault.jpg"
              )

              youtube_cards.append(
                  f"""
          <table>
            <tr>
              <td width="220">
                <a href="{escape_html(video_url)}">
                  <img src="{thumbnail}" width="200">
                </a>
              </td>
              <td>
                <a href="{escape_html(video_url)}">
                  <strong>{escape_html(title)}</strong>
                </a>
                <br>
                <sub>Latest YouTube Video</sub>
              </td>
            </tr>
          </table>
          """
              )

          if youtube_cards:
              youtube_content = "\n".join(youtube_cards)
          else:
              youtube_content = "_No YouTube videos found yet._"

          # ---------------------------------------------------------
          # DEV.to
          # ---------------------------------------------------------

          dev_root = ET.fromstring(fetch(DEV_FEED))

          dev_items = dev_root.findall("./channel/item")[:5]

          dev_cards = []

          MEDIA = "{http://search.yahoo.com/mrss/}"

          for item in dev_items:

              title = item.findtext(
                  "title",
                  default="Untitled Post"
              )

              link = item.findtext(
                  "link",
                  default=""
              )

              if not link:
                  continue

              # Try to find the cover image.
              image_url = ""

              media_content = item.find(
                  f"{MEDIA}content"
              )

              if media_content is not None:
                  image_url = media_content.attrib.get(
                      "url",
                      ""
                  )

              enclosure = item.find("enclosure")

              if not image_url and enclosure is not None:
                  image_url = enclosure.attrib.get(
                      "url",
                      ""
                  )

              title = escape_html(title)
              link = escape_html(link)

              if image_url:
                  image_html = (
                      f'<img src="{escape_html(image_url)}" '
                      f'width="200">'
                  )
              else:
                  image_html = (
                      '<div><strong>DEV.to</strong></div>'
                  )

              dev_cards.append(
                  f"""
          <table>
            <tr>
              <td width="220">
                <a href="{link}">
                  {image_html}
                </a>
              </td>
              <td>
                <a href="{link}">
                  <strong>{title}</strong>
                </a>
                <br>
                <sub>Latest DEV.to Post</sub>
              </td>
            </tr>
          </table>
          """
              )

          if dev_cards:
              dev_content = "\n".join(dev_cards)
          else:
              dev_content = "_No DEV.to posts yet._"

          # ---------------------------------------------------------
          # Update README
          # ---------------------------------------------------------

          with open(README, "r", encoding="utf-8") as file:
              readme = file.read()

          readme = update_section(
              readme,
              "<!-- YOUTUBE:START -->",
              "<!-- YOUTUBE:END -->",
              youtube_content
          )

          readme = update_section(
              readme,
              "<!-- BLOG:START -->",
              "<!-- BLOG:END -->",
              dev_content
          )

          with open(README, "w", encoding="utf-8") as file:
              file.write(readme)

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README changes."
          else
            git commit -m "chore: update README feeds"
            git push
          fi