name: Update README

on:
  schedule:
    # Every 6 hours
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README feeds
        run: |
          python <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import html
          import re
          import time

          README = "README.md"

          YOUTUBE_FEED = (
              "https://www.youtube.com/feeds/videos.xml?"
              "channel_id=UC1eVpwYmIxLqi84OroyZo6w"
          )

          DEV_FEED = "https://dev.to/feed/brdnwd"

          # ---------------------------------------------------------
          # Fetch a feed with retries
          # ---------------------------------------------------------

          def fetch(url, retries=5):
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      print(f"Fetching: {url}")
                      print(f"Attempt {attempt}/{retries}")

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": (
                                  "Mozilla/5.0 "
                                  "(compatible; brdnwd-readme-updater/1.0)"
                              )
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          return response.read()

                  except Exception as error:
                      last_error = error
                      print(f"Request failed: {error}")

                      if attempt < retries:
                          wait_time = attempt * 10
                          print(
                              f"Waiting {wait_time} seconds..."
                          )
                          time.sleep(wait_time)

              raise last_error

          # ---------------------------------------------------------
          # Clean HTML from descriptions
          # ---------------------------------------------------------

          def clean_description(text):
              if not text:
                  return ""

              # Decode HTML entities
              text = html.unescape(text)

              # Remove HTML tags
              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              # Remove URLs
              text = re.sub(
                  r"https?://\S+",
                  "",
                  text
              )

              # Collapse whitespace
              text = re.sub(
                  r"\s+",
                  " ",
                  text
              ).strip()

              return text

          # ---------------------------------------------------------
          # Limit description to 20 words
          # ---------------------------------------------------------

          def shorten_description(text, max_words=20):
              text = clean_description(text)

              if not text:
                  return ""

              words = text.split()

              if len(words) <= max_words:
                  return text

              return " ".join(words[:max_words]) + "..."

          # ---------------------------------------------------------
          # Escape text for HTML
          # ---------------------------------------------------------

          def escape(text):
              return html.escape(
                  text,
                  quote=True
              )

          # ---------------------------------------------------------
          # Update README section
          # ---------------------------------------------------------

          def update_section(
              readme,
              start_marker,
              end_marker,
              content
          ):
              pattern = (
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker)
              )

              replacement = (
                  start_marker
                  + "\n"
                  + content
                  + "\n"
                  + end_marker
              )

              updated, count = re.subn(
                  pattern,
                  replacement,
                  readme,
                  count=1,
                  flags=re.DOTALL
              )

              if count == 0:
                  print(
                      f"WARNING: Could not find "
                      f"{start_marker}"
                  )

              return updated

          # ---------------------------------------------------------
          # Create one compact card
          # ---------------------------------------------------------

          def create_card(
              url,
              thumbnail,
              title,
              description
          ):
              title = escape(title)
              description = escape(description)

              if description:
                  description_html = (
                      f"<sub>{description}</sub>"
                  )
              else:
                  description_html = ""

              return f"""
          <td width="50%" valign="top">
          <table>
          <tr>
          <td width="120" valign="top" style="padding: 0;">
          <a href="{url}">
          <img src="{thumbnail}" width="120" height="68">
          </a>
          </td>
          <td valign="top" style="padding: 8px 12px;">
          <a href="{url}">
          <strong>{title}</strong>
          </a>
          <br>
          {description_html}
          </td>
          </tr>
          </table>
          </td>
          """

          # ---------------------------------------------------------
          # Build a 2-column grid
          # ---------------------------------------------------------

          def create_grid(cards):
              rows = []

              for i in range(0, len(cards), 2):
                  first = cards[i]

                  if i + 1 < len(cards):
                      second = cards[i + 1]
                  else:
                      second = '<td width="50%"></td>'

                  rows.append(
                      f"""
          <tr>
          {first}
          {second}
          </tr>
          """
                  )

              return (
                  "<table>\n"
                  + "\n".join(rows)
                  + "\n</table>"
              )

          # ---------------------------------------------------------
          # Read README
          # ---------------------------------------------------------

          with open(
              README,
              "r",
              encoding="utf-8"
          ) as file:
              readme = file.read()

          original_readme = readme

          # =========================================================
          # YOUTUBE
          # =========================================================

          try:
              print("\nFetching YouTube feed...")

              youtube_data = fetch(
                  YOUTUBE_FEED,
                  retries=5
              )

              youtube_root = ET.fromstring(
                  youtube_data
              )

              ATOM = (
                  "{http://www.w3.org/2005/Atom}"
              )

              MEDIA = (
                  "{http://search.yahoo.com/mrss/}"
              )

              YOUTUBE = (
                  "{http://www.youtube.com/xml/"
                  "schemas/2015}"
              )

              youtube_cards = []

              entries = youtube_root.findall(
                  f"{ATOM}entry"
              )[:4]

              for entry in entries:

                  title = entry.findtext(
                      f"{ATOM}title",
                      default="Untitled Video"
                  )

                  video_id = entry.findtext(
                      f"{YOUTUBE}videoId",
                      default=""
                  )

                  link_element = entry.find(
                      f"{ATOM}link"
                  )

                  video_url = ""

                  if link_element is not None:
                      video_url = (
                          link_element.attrib.get(
                              "href",
                              ""
                          )
                      )

                  if not video_url and video_id:
                      video_url = (
                          "https://www.youtube.com/watch?v="
                          + video_id
                      )

                  if not video_id or not video_url:
                      continue

                  # -----------------------------------------------
                  # Get YouTube description
                  # -----------------------------------------------

                  description = ""

                  media_group = entry.find(
                      f"{MEDIA}group"
                  )

                  if media_group is not None:
                      description = (
                          media_group.findtext(
                              f"{MEDIA}description",
                              default=""
                          )
                      )

                  # Fallback to Atom summary
                  if not description:
                      description = entry.findtext(
                          f"{ATOM}summary",
                          default=""
                      )

                  description = shorten_description(
                      description,
                      20
                  )

                  thumbnail = (
                      "https://img.youtube.com/vi/"
                      + video_id
                      + "/mqdefault.jpg"
                  )

                  youtube_cards.append(
                      create_card(
                          video_url,
                          thumbnail,
                          title,
                          description
                      )
                  )

              if youtube_cards:

                  youtube_content = create_grid(
                      youtube_cards
                  )

                  readme = update_section(
                      readme,
                      "<!-- YOUTUBE:START -->",
                      "<!-- YOUTUBE:END -->",
                      youtube_content
                  )

                  print(
                      "YouTube section updated."
                  )

              else:
                  print(
                      "No YouTube videos found."
                  )

          except Exception as error:

              print(
                  "WARNING: YouTube feed could not "
                  f"be updated: {error}"
              )

              print(
                  "Keeping existing YouTube section."
              )

          # =========================================================
          # DEV.TO
          # =========================================================

          try:
              print("\nFetching DEV.to feed...")

              dev_data = fetch(
                  DEV_FEED,
                  retries=3
              )

              dev_root = ET.fromstring(
                  dev_data
              )

              dev_items = dev_root.findall(
                  "./channel/item"
              )[:8]

              dev_cards = []

              for item in dev_items:

                  title = item.findtext(
                      "title",
                      default="Untitled Post"
                  )

                  link = item.findtext(
                      "link",
                      default=""
                  )

                  if not link:
                      continue

                  # -----------------------------------------------
                  # Get description
                  # -----------------------------------------------

                  description = item.findtext(
                      "description",
                      default=""
                  )

                  description = shorten_description(
                      description,
                      20
                  )

                  # -----------------------------------------------
                  # Get post image
                  # -----------------------------------------------

                  image_url = ""

                  # Try enclosure
                  enclosure = item.find(
                      "enclosure"
                  )

                  if enclosure is not None:
                      image_url = (
                          enclosure.attrib.get(
                              "url",
                              ""
                          )
                      )

                  # Try Media RSS
                  if not image_url:

                      media_content = item.find(
                          "{http://search.yahoo.com/"
                          "mrss/}content"
                      )

                      if media_content is not None:
                          image_url = (
                              media_content.attrib.get(
                                  "url",
                                  ""
                              )
                          )

                  # Fallback image
                  if not image_url:
                      image_url = (
                          "https://placehold.co/"
                          "120x68/0a0a0a/ffffff"
                          "?text=DEV.to"
                      )

                  dev_cards.append(
                      create_card(
                          link,
                          image_url,
                          title,
                          description
                      )
                  )

              if dev_cards:

                  dev_content = create_grid(
                      dev_cards
                  )

              else:

                  dev_content = (
                      "<p><em>"
                      "No DEV.to posts yet."
                      "</em></p>"
                  )

              readme = update_section(
                  readme,
                  "<!-- BLOG:START -->",
                  "<!-- BLOG:END -->",
                  dev_content
              )

              print(
                  "DEV.to section updated."
              )

          except Exception as error:

              print(
                  "WARNING: DEV.to feed could not "
                  f"be updated: {error}"
              )

              print(
                  "Keeping existing DEV.to section."
              )

          # =========================================================
          # SAVE README
          # =========================================================

          if readme != original_readme:

              with open(
                  README,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(readme)

              print(
                  "\nREADME.md was updated."
              )

          else:

              print(
                  "\nNo README changes were necessary."
              )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update README feeds"
            git push
          fi