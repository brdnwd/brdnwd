name: Update README

on:
  schedule:
    - cron: "17 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README feeds
        run: |
          python <<'PY'
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          import html
          import re
          import time

          README = "README.md"

          YOUTUBE_FEED = (
              "https://www.youtube.com/feeds/videos.xml?"
              "channel_id=UC1eVpwYmIxLqi84OroyZo6w"
          )

          DEV_FEED = "https://dev.to/feed/brdnwd"

          # ---------------------------------------------------------
          # Fetch RSS feed with retries
          # ---------------------------------------------------------

          def fetch(url, retries=5):
              last_error = None

              for attempt in range(1, retries + 1):
                  try:
                      print(f"Fetching: {url}")
                      print(f"Attempt {attempt}/{retries}")

                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": (
                                  "Mozilla/5.0 "
                                  "(compatible; brdnwd-readme-updater/1.0)"
                              )
                          }
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=30
                      ) as response:
                          return response.read()

                  except Exception as error:
                      last_error = error
                      print(f"Request failed: {error}")

                      if attempt < retries:
                          wait_time = attempt * 10
                          print(
                              f"Waiting {wait_time} seconds "
                              "before retrying..."
                          )
                          time.sleep(wait_time)

              raise last_error

          # ---------------------------------------------------------
          # Update a README section
          # ---------------------------------------------------------

          def update_section(
              readme,
              start_marker,
              end_marker,
              content
          ):
              pattern = (
                  re.escape(start_marker)
                  + r".*?"
                  + re.escape(end_marker)
              )

              replacement = (
                  start_marker
                  + "\n"
                  + content
                  + "\n"
                  + end_marker
              )

              updated, count = re.subn(
                  pattern,
                  replacement,
                  readme,
                  count=1,
                  flags=re.DOTALL
              )

              if count == 0:
                  print(
                      f"WARNING: Could not find markers "
                      f"{start_marker} / {end_marker}"
                  )

              return updated

          # ---------------------------------------------------------
          # Read README
          # ---------------------------------------------------------

          with open(
              README,
              "r",
              encoding="utf-8"
          ) as file:
              readme = file.read()

          original_readme = readme

          # ---------------------------------------------------------
          # YouTube
          # ---------------------------------------------------------

          try:
              print("\nFetching YouTube feed...")

              youtube_data = fetch(YOUTUBE_FEED)
              youtube_root = ET.fromstring(youtube_data)

              ATOM = "{http://www.w3.org/2005/Atom}"
              YOUTUBE = "{http://www.youtube.com/xml/schemas/2015}"

              youtube_cards = []

              for entry in youtube_root.findall(
                  f"{ATOM}entry"
              )[:5]:

                  title = entry.findtext(
                      f"{ATOM}title",
                      default="Untitled Video"
                  )

                  video_id = entry.findtext(
                      f"{YOUTUBE}videoId",
                      default=""
                  )

                  link_element = entry.find(
                      f"{ATOM}link"
                  )

                  video_url = ""

                  if link_element is not None:
                      video_url = link_element.attrib.get(
                          "href",
                          ""
                      )

                  if not video_url and video_id:
                      video_url = (
                          "https://www.youtube.com/watch?v="
                          + video_id
                      )

                  if not video_id or not video_url:
                      continue

                  title = html.escape(
                      title,
                      quote=True
                  )

                  thumbnail = (
                      "https://img.youtube.com/vi/"
                      + video_id
                      + "/mqdefault.jpg"
                  )

                  youtube_cards.append(
                      f"""
          <table>
            <tr>
              <td width="220">
                <a href="{video_url}">
                  <img
                    src="{thumbnail}"
                    width="200"
                  >
                </a>
              </td>
              <td>
                <a href="{video_url}">
                  <strong>{title}</strong>
                </a>
                <br>
                <sub>YouTube</sub>
              </td>
            </tr>
          </table>
          """
                  )

              if youtube_cards:
                  youtube_content = "\n".join(
                      youtube_cards
                  )

                  readme = update_section(
                      readme,
                      "<!-- YOUTUBE:START -->",
                      "<!-- YOUTUBE:END -->",
                      youtube_content
                  )

                  print(
                      "YouTube section updated."
                  )

              else:
                  print(
                      "YouTube feed returned no videos."
                  )

          except Exception as error:
              print(
                  "WARNING: YouTube feed could not be "
                  f"updated: {error}"
              )

              print(
                  "Keeping the existing YouTube section."
              )

          # ---------------------------------------------------------
          # DEV.to
          # ---------------------------------------------------------

          try:
              print("\nFetching DEV.to feed...")

              dev_data = fetch(
                  DEV_FEED,
                  retries=3
              )

              dev_root = ET.fromstring(dev_data)

              dev_items = dev_root.findall(
                  "./channel/item"
              )[:5]

              dev_cards = []

              for item in dev_items:

                  title = item.findtext(
                      "title",
                      default="Untitled Post"
                  )

                  link = item.findtext(
                      "link",
                      default=""
                  )

                  if not link:
                      continue

                  title = html.escape(
                      title,
                      quote=True
                  )

                  link = html.escape(
                      link,
                      quote=True
                  )

                  # Try to find a cover image.
                  image_url = ""

                  # RSS enclosure
                  enclosure = item.find(
                      "enclosure"
                  )

                  if enclosure is not None:
                      image_url = enclosure.attrib.get(
                          "url",
                          ""
                      )

                  # Media RSS image
                  if not image_url:
                      media_content = item.find(
                          "{http://search.yahoo.com/mrss/}content"
                      )

                      if media_content is not None:
                          image_url = media_content.attrib.get(
                              "url",
                              ""
                          )

                  if image_url:
                      image_html = (
                          f'<img src="{html.escape(image_url, quote=True)}" '
                          'width="200">'
                      )
                  else:
                      image_html = (
                          "<strong>DEV.to</strong>"
                      )

                  dev_cards.append(
                      f"""
          <table>
            <tr>
              <td width="220">
                <a href="{link}">
                  {image_html}
                </a>
              </td>
              <td>
                <a href="{link}">
                  <strong>{title}</strong>
                </a>
                <br>
                <sub>DEV.to</sub>
              </td>
            </tr>
          </table>
          """
                  )

              if dev_cards:
                  dev_content = "\n".join(
                      dev_cards
                  )

              else:
                  dev_content = (
                      "_No DEV.to posts yet._"
                  )

              readme = update_section(
                  readme,
                  "<!-- BLOG:START -->",
                  "<!-- BLOG:END -->",
                  dev_content
              )

              print(
                  "DEV.to section updated."
              )

          except Exception as error:
              print(
                  "WARNING: DEV.to feed could not be "
                  f"updated: {error}"
              )

              print(
                  "Keeping the existing DEV.to section."
              )

          # ---------------------------------------------------------
          # Save README
          # ---------------------------------------------------------

          if readme != original_readme:

              with open(
                  README,
                  "w",
                  encoding="utf-8"
              ) as file:
                  file.write(readme)

              print(
                  "\nREADME.md was updated."
              )

          else:
              print(
                  "\nNo README changes were necessary."
              )

          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update README feeds"
            git push
          fi